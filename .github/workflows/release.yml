name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Verify version and create update package
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"
          zip codex-pulse-update.zip app.js dashboard.html style.css codex_pulse.py overlay.py updater.py VERSION pricing.json README.md iniciar-flutuante-windows.bat iniciar-windows.bat iniciar-flutuante-macos-linux.sh iniciar-macos-linux.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" codex-pulse-update.zip --generate-notes
